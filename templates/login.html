<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            background-color: #080a12;
            background-image:
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.08) 0px, transparent 50%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif; color: white;
            overflow: hidden;
        }

        .container { text-align: center; z-index: 1; }

        h1 {
            font-size: 36px; font-weight: 800; margin-bottom: 30px;
            background: linear-gradient(to right, #ef4444, #f97316, #facc15);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }


        .box { display: flex; gap: 20px; justify-content: center; }
        .card-link { text-decoration: none; color: white; }

        .card {
            width: 200px; padding: 50px 20px; border-radius: 25px;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            font-weight: 700; font-size: 18px; text-align: center;
        }

        .card:hover {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.05);
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(249, 115, 22, 0.2);
            color: #facc15;
        }


        .login-box {
            background: rgba(255, 255, 255, 0.02); padding: 40px;
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.08);
            width: 380px; backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        input {
            width: 100%; padding: 15px; margin: 12px 0;
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); color: white;
            outline: none; transition: 0.3s;
        }

        input:focus {
            border-color: #f97316;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.1);
        }

        .login-btn {
            width: 100%; padding: 15px; margin-top: 20px;
            background: #f97316; border: none; border-radius: 12px;
            color: white; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
        }

        .login-btn:hover {
            background: #fb923c;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(249, 115, 22, 0.4);
        }

        .back-link {
            margin-top: 20px; display: inline-block;
            color: #94a3b8; text-decoration: none; font-size: 14px;
            transition: 0.3s; font-weight: 600;
        }

        .back-link:hover { color: #facc15; }

        .error-msg {
            color: #ef4444; background: rgba(239, 68, 68, 0.1);
            padding: 10px; border-radius: 8px; margin-bottom: 15px;
            font-size: 14px; border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">

        {% if login_type %}

            <h1>{{ login_type|title }} Login</h1>
            <div class="login-box">
                <form method="POST" action="{% url 'login' %}?type={{ login_type }}">
                    {% csrf_token %}

                    {% if error %}
                        <div class="error-msg">{{ error }}</div>
                    {% endif %}

                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Login Now</button>
                </form>
                <a href="{% url 'login' %}" class="back-link">← Change Login Type</a>
            </div>

        {% else %}

            <h1>Select Login Type</h1>
            <div class="box">
                <a href="?type=student" class="card-link">
                    <div class="card">
                        <div style="font-size: 40px; margin-bottom: 15px;">🎓</div>
                        Student Login
                    </div>
                </a>
                <a href="?type=staff" class="card-link">
                    <div class="card">
                        <div style="font-size: 40px; margin-bottom: 15px;">👨‍🍳</div>
                        Staff Login
                    </div>
                </a>
            </div>

        {% endif %}

    </div>

</body>
</html>
