<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBite - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar-item:hover {
            background: #1a1a1a;
            color: #D4A017;
            border-radius: 12px;
        }
        .active-nav {
            background: rgba(212,160,23,0.15);
            color: #D4A017;
            border-radius: 12px;
        }
        .profile-container {
            background-color: #141414;
            border: 1px solid #1f1f1f;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .section-title {
            color: #D4A017;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .custom-input {
            background-color: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: #ffffff !important;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            outline: none;
        }
        .custom-input:focus {
            border-color: #D4A017 !important;
        }
        .btn-save {
            background-color: #D4A017;
            color: #000000;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            transition: 0.3s;
        }
        .btn-save:hover {
            background-color: #b88614;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

<aside class="w-64 bg-[#0d0d0d] border-r border-gray-900 flex flex-col p-6">
    <div class="text-2xl font-bold text-[#D4A017] mb-10 text-center tracking-wide">
        SmartBite
    </div>
    <nav class="space-y-2 flex-1">
        <a href="{% url 'dashboard' %}" class="sidebar-item flex items-center gap-3 p-3 text-gray-500 transition">
            <i class="fas fa-home w-5"></i> Dashboard
        </a>
        <a href="{% url 'menu' %}" class="sidebar-item flex items-center gap-3 p-3 text-gray-500 transition">
            <i class="fas fa-utensils w-5"></i> Browse Menu
        </a>
        <a href="{% url 'orders_view' %}" class="sidebar-item flex items-center gap-3 p-3 text-gray-500">
            <i class="fas fa-file-alt w-5"></i> My Orders
        </a>
        <a href="#" class="sidebar-item flex items-center gap-3 p-3 text-gray-500">
            <i class="fas fa-bell w-5"></i> Notifications
        </a>
        <a href="#" class="sidebar-item flex items-center gap-3 p-3 text-gray-500">
            <i class="fas fa-star w-5"></i> Feedback
        </a>
        <a href="{% url 'profile' %}" class="active-nav flex items-center gap-3 p-3">
            <i class="fas fa-user w-5"></i> Profile
        </a>
    </nav>
</aside>

<main class="flex-1 overflow-y-auto p-10">
    <header class="mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">My Profile</h1>
        <p class="text-gray-500">Manage your personal information</p>
    </header>

    <div class="max-w-4xl">
        <div class="profile-container">
            <h3 class="section-title text-xl mb-4">Personal Information</h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="bg-green-900/30 border border-green-500 text-green-400 p-3 rounded-xl mb-4" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Full Name</label>
                        <input type="text" name="full_name" class="custom-input" value="{{ form.full_name.value|default:'' }}">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Email</label>
                        <input type="email" name="email" class="custom-input" value="{{ form.email.value|default:'' }}">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Phone</label>
                        <input type="text" name="phone" class="custom-input" value="{{ form.phone.value|default:'' }}">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Department</label>
                        <input type="text" name="department" class="custom-input" value="{{ form.department.value|default:'' }}">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Student ID</label>
                        <input type="text" name="student_id" class="custom-input opacity-60" value="{{ form.student_id.value|default:'' }}" readonly>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 uppercase mb-2">Role</label>
                        <input type="text" name="role" class="custom-input opacity-60" value="{{ form.role.value|default:'' }}" readonly>
                    </div>
                </div>

                <button type="submit" class="btn-save mt-2">Save Changes</button>
            </form>
        </div>

        <div class="profile-container">
            <h3 class="section-title text-xl mb-4">Change Password</h3>
            <form action="#" method="POST" class="max-w-md">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="password" name="old_password" class="custom-input" placeholder="Current password">
                </div>
                <div class="mb-4">
                    <input type="password" name="new_password1" class="custom-input" placeholder="New password">
                </div>
                <div class="mb-6">
                    <input type="password" name="new_password2" class="custom-input" placeholder="Confirm new password">
                </div>
                <button type="submit" class="btn-save">Update Password</button>
            </form>
        </div>
    </div>
</main>

</body>
